# NEXORA OS XFCE — Debian Installer preseed
# Boot argument:
# priority=high preseed/file=/cdrom/nexora/preseed/desktop.cfg
d-i debian-installer/locale string es_CL.UTF-8
d-i keyboard-configuration/xkb-keymap select latam
d-i netcfg/hostname string nexora
d-i netcfg/get_hostname string nexora
d-i netcfg/get_domain string unassigned-domain

# Partitioning deliberately remains interactive; no automatic recipe is supplied.
# The user must review every disk and formatting confirmation.
tasksel tasksel/first multiselect standard, xfce-desktop

d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false

# NEXORA desktop runtime and GTK utilities.
d-i pkgsel/include string flatpak python3-gi gir1.2-gtk-3.0 policykit-1 lxpolkit xfce4-taskmanager

# Install NEXORA desktop assets into the new system after package installation.
d-i preseed/late_command string cp -a /cdrom/nexora/desktop-overlay/. /target/; in-target /bin/sh /usr/local/sbin/nexora-postinstall
