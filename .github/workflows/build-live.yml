name: Build NEXORA OS XFCE4 Live

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexora-minimal-terminal
    paths:
      - "config/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-live.yml"
  pull_request:
    branches:
      - main
    paths:
      - "config/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-live.yml"

permissions:
  contents: write

concurrency:
  group: nexora-xfce-live-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-live:
    name: Build and smoke-test XFCE4 Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools qemu-system-x86

      - name: Validate NEXORA configuration
        run: sh ./scripts/validate-config.sh

      - name: Build XFCE4 Live ISO
        run: sudo bash ./scripts/build-live.sh

      - name: Verify and boot-test ISO
        env:
          NEXORA_QEMU_BOOT_SECONDS: "90"
        run: |
          ISO="build-output/nexora-os-xfce4-live-amd64.iso"
          test -s "$ISO"
          test -s "$ISO.sha256"
          sha256sum --check "$ISO.sha256"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Upload Live ISO artifact
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Archive XFCE4 Live ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-xfce4-live-amd64
          path: |
            build-output/nexora-os-xfce4-live-amd64.iso
            build-output/nexora-os-xfce4-live-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish automatic alpha release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/nexora-minimal-terminal'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: NEXORA OS XFCE4 Live v0.1.0-alpha.${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## NEXORA OS XFCE4 Live — automatic alpha

            Published automatically after the Live ISO passes configuration validation, ISO/checksum verification and the QEMU boot smoke test.

            - Base: Debian GNU/Linux 13 (Trixie)
            - Architecture: amd64 (x86_64)
            - Desktop: XFCE4 NEXORA Live session
            - Image: hybrid Live ISO for USB and virtual machines
            - Installer: Debian Installer Live, launched from NEXORA's branded welcome app

            Experimental alpha. Test in a virtual machine first and carefully review disk and partition choices before installing.
          files: |
            build-output/nexora-os-xfce4-live-amd64.iso
            build-output/nexora-os-xfce4-live-amd64.iso.sha256
