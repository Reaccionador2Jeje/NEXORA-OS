name: Build NEXORA OS XFCE4 Live

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexora-minimal-terminal
    paths:
      - "config/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-live.yml"
  pull_request:
    branches:
      - main
    paths:
      - "config/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-live.yml"

permissions:
  contents: read

concurrency:
  group: nexora-xfce-live-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-live:
    name: Build and smoke-test XFCE4 Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live, VM and publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools qemu-system-x86 rsync openssh-client

      - name: Validate NEXORA configuration
        run: sh ./scripts/validate-config.sh

      - name: Build XFCE4 Live ISO
        run: sudo bash ./scripts/build-live.sh

      - name: Verify and boot-test ISO
        env:
          NEXORA_QEMU_BOOT_SECONDS: "90"
        run: |
          ISO="build-output/nexora-os-xfce4-live-amd64.iso"
          test -s "$ISO"
          test -s "$ISO.sha256"
          sha256sum --check "$ISO.sha256"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Make build output readable
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Archive XFCE4 Live ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-xfce4-live-amd64
          path: |
            build-output/nexora-os-xfce4-live-amd64.iso
            build-output/nexora-os-xfce4-live-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified XFCE4 Live ISO to SourceForge
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/nexora-minimal-terminal'
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          NEXORA_ISO_PATH: build-output/nexora-os-xfce4-live-amd64.iso
          NEXORA_RELEASE_DIR: NEXORA-OS-XFCE4-Live-alpha-${{ github.run_number }}.${{ github.run_attempt }}
          NEXORA_RELEASE_TITLE: NEXORA OS XFCE4 Live alpha ${{ github.run_number }}.${{ github.run_attempt }}
          NEXORA_RELEASE_DESCRIPTION: Debian 13 Trixie based live desktop image with XFCE4 and NEXORA customizations.
        run: |
          if [ -z "$SF_USERNAME" ] || [ -z "$SF_PROJECT" ] || [ -z "$SF_SSH_PRIVATE_KEY" ]; then
            echo "::notice::SourceForge upload skipped. Configure SF_USERNAME, SF_PROJECT and SF_SSH_PRIVATE_KEY in GitHub Actions secrets."
            exit 0
          fi
          sh ./scripts/publish-sourceforge.sh
