name: Build NEXORA OS Minimal GTK Netinst

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexora-minimal-terminal
    paths:
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: nexora-minimal-netinst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-netinst:
    name: Build Debian Installer GTK netinst (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso cpio gzip qemu-system-x86

      - name: Check build dependencies
        run: sh ./scripts/check-dependencies.sh

      - name: Validate installer configuration
        run: sh ./scripts/validate-config.sh

      - name: Build NEXORA GTK netinst
        run: sudo sh ./scripts/build.sh

      - name: Inspect ISO boot menu layout
        run: sh ./scripts/inspect-boot-layout.sh build-output/nexora-os-minimal-netinst-amd64.iso

      - name: Boot ISO in QEMU (BIOS smoke test)
        env:
          NEXORA_QEMU_BOOT_SECONDS: "90"
        run: |
          ISO="build-output/nexora-os-minimal-netinst-amd64.iso"
          test -s "$ISO"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Make artifact readable
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Upload netinst ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-minimal-gtk-netinst-amd64
          path: build-output/nexora-os-minimal-netinst-amd64.iso
          if-no-files-found: error
          retention-days: 7
