name: Build NEXORA OS Minimal ISO

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexora-minimal-terminal
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: nexora-minimal-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-minimal-iso:
    name: Build Minimal ISO (Debian Trixie / amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Check build dependencies
        run: sudo ./scripts/check-dependencies.sh

      - name: Validate Minimal configuration
        run: sh ./scripts/validate-config.sh

      - name: Build NEXORA OS Minimal
        run: sudo ./scripts/build.sh

      - name: Install QEMU for ISO boot test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Test ISO boot in QEMU (BIOS, headless)
        env:
          NEXORA_QEMU_BOOT_SECONDS: "120"
        run: |
          ISO="$(find build-output -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Make artifact readable
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-minimal-terminal-amd64
          path: build-output/*.iso
          if-no-files-found: error
          retention-days: 7
