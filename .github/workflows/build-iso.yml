name: Validate NEXORA ISO project

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "docs/BUILDING.md"
      - "config/**"
      - "branding/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: nexora-iso-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Penguins' eggs integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          sh -n scripts/build.sh
          sh -n scripts/check-dependencies.sh
          sh -n scripts/validate-config.sh

      - name: Validate NEXORA configuration
        run: sh ./scripts/validate-config.sh

      - name: Verify Eggs integration contract
        run: |
          grep -q "eggs remaster --target-dir" scripts/build.sh
          grep -q "/etc/nexora-release" scripts/build.sh
          grep -q "Penguins' eggs" docs/BUILDING.md
