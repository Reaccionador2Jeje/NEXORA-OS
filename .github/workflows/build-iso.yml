name: Build NEXORA OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/nexora-xfce-hyperlight-ci
      - feature/nexora-desktop-2.0
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: nexora-iso-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Validate source and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          for file in auto/config scripts/*.sh config/hooks/normal/*.hook.chroot; do
            sh -n "$file"
          done

      - name: Validate NEXORA configuration
        run: sh ./scripts/validate-config.sh

  build-desktop-iso:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Build Desktop ISO (Debian Trixie / amd64)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Check build dependencies
        run: sudo ./scripts/check-dependencies.sh

      - name: Build NEXORA OS
        run: sudo ./scripts/build.sh

      - name: Install QEMU for ISO process smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Run QEMU ISO process smoke test (not guest boot verification)
        env:
          NEXORA_QEMU_BOOT_SECONDS: "120"
        run: |
          ISO="$(find build-output -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Prepare versioned ISO and SHA-256 checksum
        if: success()
        run: |
          ISO="$(find build-output -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p build-output/publish
          cp "$ISO" "build-output/publish/NEXORA-OS-0.2.0-amd64-${SHORT_SHA}.iso"
          cd build-output/publish
          sha256sum ./*.iso > SHA256SUMS

      - name: Make ISO artifact readable
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Upload verified ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-xfce4-amd64-${{ github.sha }}
          path: build-output/publish/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified ISO to SourceForge
        if: success() && github.event_name != 'pull_request'
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SF_USERNAME" || { echo "Missing SF_USERNAME secret." >&2; exit 1; }
          test -n "$SF_PROJECT" || { echo "Missing SF_PROJECT secret." >&2; exit 1; }
          test -n "$SF_SSH_PRIVATE_KEY" || { echo "Missing SF_SSH_PRIVATE_KEY secret." >&2; exit 1; }

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client rsync

          KEY_FILE="$RUNNER_TEMP/sourceforge_deploy_key"
          KNOWN_HOSTS="$RUNNER_TEMP/sourceforge_known_hosts"
          printf '%s\n' "$SF_SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          ssh-keyscan -T 15 -t ed25519 frs.sourceforge.net > "$KNOWN_HOSTS" 2>/dev/null
          test -s "$KNOWN_HOSTS"
          HOST_FINGERPRINT="$(ssh-keygen -lf "$KNOWN_HOSTS" -E sha256 | awk 'NR == 1 {print $2}')"
          EXPECTED_FINGERPRINT="SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY"
          if [ "$HOST_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "SourceForge SSH host fingerprint did not match the published ED25519 fingerprint." >&2
            exit 1
          fi

          rsync --archive --verbose --partial --progress --mkpath -e "ssh -i $KEY_FILE -o IdentitiesOnly=yes -o UserKnownHostsFile=$KNOWN_HOSTS -o StrictHostKeyChecking=yes" build-output/publish/ "$SF_USERNAME@frs.sourceforge.net:/home/frs/project/$SF_PROJECT/0.2.0/"
