name: Build NEXORA OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auto/**"
      - "config/**"
      - "branding/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: nexora-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop-iso:
    name: Build Desktop ISO (Debian Trixie / amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Check build dependencies
        run: sudo ./scripts/check-dependencies.sh

      - name: Validate NEXORA configuration
        run: sh ./scripts/validate-config.sh

      - name: Build NEXORA OS
        run: sudo ./scripts/build.sh

      - name: Make artifact readable
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-desktop-amd64
          path: build-output/*.iso
          if-no-files-found: error
          retention-days: 7
