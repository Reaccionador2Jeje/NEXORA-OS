name: Build NEXORA OS Minimal GTK Netinst

# Re-run the validated build after SourceForge publishing credentials were configured.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/nexora-minimal-terminal
    paths:
      - "config/**"
      - "installer/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: nexora-minimal-netinst-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-netinst:
    name: Build and smoke-test Minimal GTK netinst ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO, VM and publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso cpio gzip qemu-system-x86 qemu-utils rsync openssh-client live-build debootstrap debian-archive-keyring squashfs-tools librsvg2-bin

      - name: Check build dependencies
        run: sh ./scripts/check-dependencies.sh

      - name: Validate installer configuration
        run: sh ./scripts/validate-config.sh

      - name: Check SourceForge uploader shell syntax
        run: sh -n ./scripts/publish-sourceforge.sh

      - name: Build NEXORA Minimal native GTK installer
        run: sudo sh ./scripts/build.sh

      # The builder runs as root; restore runner ownership before creating
      # checksums, running checks, or uploading files.
      - name: Make build output writable for validation
        if: success()
        run: sudo chown -R "$USER:$USER" build-output

      - name: Inspect ISO boot menu layout
        run: sh ./scripts/inspect-boot-layout.sh build-output/nexora-os-minimal-netinst-amd64.iso

      - name: Boot ISO in QEMU (BIOS smoke test)
        env:
          NEXORA_QEMU_BOOT_SECONDS: "90"
        run: |
          ISO="build-output/nexora-os-minimal-netinst-amd64.iso"
          test -s "$ISO"
          sh ./scripts/test-qemu-boot.sh "$ISO"
          (
            cd "$(dirname "$ISO")"
            sha256sum "$(basename "$ISO")" > "$(basename "$ISO").sha256"
            sha256sum --check "$(basename "$ISO").sha256"
          )

      - name: Upload Minimal GTK netinst ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-os-minimal-gtk-netinst-amd64
          path: |
            build-output/nexora-os-minimal-netinst-amd64.iso
            build-output/nexora-os-minimal-netinst-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified Minimal GTK netinst ISO to SourceForge
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/nexora-minimal-terminal'
        env:
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_PRIVATE_KEY: ${{ secrets.SF_SSH_PRIVATE_KEY }}
          NEXORA_ISO_PATH: build-output/nexora-os-minimal-netinst-amd64.iso
          NEXORA_RELEASE_DIR: NEXORA-OS-Minimal-GTK-Netinst-alpha-${{ github.run_number }}.${{ github.run_attempt }}
          NEXORA_RELEASE_TITLE: NEXORA OS Minimal GTK Netinst alpha ${{ github.run_number }}.${{ github.run_attempt }}
          NEXORA_RELEASE_DESCRIPTION: Debian 13 Trixie based minimal live installer that boots directly into the native NEXORA GTK installation wizard.
        run: |
          if [ -z "$SF_USERNAME" ] || [ -z "$SF_PROJECT" ] || [ -z "$SF_SSH_PRIVATE_KEY" ]; then
            echo "::notice::SourceForge upload skipped. Configure SF_USERNAME, SF_PROJECT and SF_SSH_PRIVATE_KEY in GitHub Actions secrets."
            exit 0
          fi
          sh ./scripts/publish-sourceforge.sh
