name: Build and publish NEXORA OS XFCE4 Live

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.0-alpha.2)"
        required: false
        default: "v0.1.0-alpha.2"
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - feature/nexora-minimal-terminal
    paths:
      - ".github/release-kickoff"

permissions:
  contents: write

concurrency:
  group: nexora-xfce-live-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build NEXORA XFCE4 Live and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Debian Live build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools qemu-system-x86

      - name: Validate configuration
        run: sh ./scripts/validate-config.sh

      - name: Build NEXORA XFCE4 Live ISO
        run: sudo ./scripts/build-live.sh

      - name: Verify Live ISO and checksum
        run: |
          ISO="build-output/nexora-os-xfce4-live-amd64.iso"
          test -s "$ISO"
          test -s "$ISO.sha256"
          sha256sum --check "$ISO.sha256"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Make release files readable
        run: sudo chown "$USER:$USER" build-output/nexora-os-xfce4-live-amd64.iso*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || 'v0.1.0-alpha.2' }}
          target_commitish: ${{ github.sha }}
          name: NEXORA OS XFCE4 Live ${{ inputs.version || 'v0.1.0-alpha.2' }}
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## NEXORA OS XFCE4 Live

            The main NEXORA desktop edition. Boots directly into a complete XFCE4 live session; no installation is required to try the system.

            - Base: Debian GNU/Linux 13 (Trixie)
            - Architecture: amd64 (x86_64)
            - Image: hybrid Live ISO for USB and virtual machines
            - Desktop: XFCE4 with NEXORA wallpapers, GTK themes and desktop tools
            - Installer: Debian Installer Live, available from the desktop as "Install NEXORA OS"
            - Language and keyboard defaults: Chilean Spanish and Latin American layout

            This is an experimental alpha release. Test in a virtual machine first. The installer is interactive; carefully review disk and partition choices before confirming any changes.
          files: |
            build-output/nexora-os-xfce4-live-amd64.iso
            build-output/nexora-os-xfce4-live-amd64.iso.sha256
