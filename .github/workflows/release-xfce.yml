name: Build and publish NEXORA OS XFCE4

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: nexora-xfce-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build NEXORA XFCE4 and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso cpio gzip qemu-system-x86

      - name: Validate configuration
        run: sh ./scripts/validate-config.sh

      - name: Build XFCE4 installer image
        env:
          NEXORA_EDITION: xfce
        run: sudo -E sh ./scripts/build.sh

      - name: Verify XFCE4 image and checksum
        run: |
          ISO="build-output/nexora-os-xfce4-netinst-amd64.iso"
          test -s "$ISO"
          sha256sum "$ISO" | tee "$ISO.sha256"
          sh ./scripts/test-qemu-boot.sh "$ISO"

      - name: Make release files readable
        run: sudo chown "$USER:$USER" build-output/nexora-os-xfce4-netinst-amd64.iso*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: NEXORA OS XFCE4 ${{ inputs.version || github.ref_name }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ## NEXORA OS XFCE4

            NEXORA desktop edition based on Debian 13 Trixie with the XFCE desktop task and the NEXORA desktop overlay.

            - Architecture: amd64 (x86_64)
            - Installer: Debian Installer GTK with NEXORA boot branding
            - Default boot profile: NEXORA OS XFCE Desktop
            - Includes NEXORA wallpapers, GTK themes, Welcome, Store, Control Center, Updater and configurable NEXORA AI client
            - Requires an Internet connection during installation
            - Disk partitioning remains interactive; review all disk choices carefully

            This is an experimental pre-release. Test in a virtual machine before installing on physical hardware. The ISO is a network installer, not a complete offline image.
          files: |
            build-output/nexora-os-xfce4-netinst-amd64.iso
            build-output/nexora-os-xfce4-netinst-amd64.iso.sha256
